[project]
name = "threads-insights-mcp"
version = "0.1.0"
description = "Read-only MCP server for Threads (Meta) posts and insights"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.12,<2",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
threads-insights-mcp = "threads_insights.server:main"
threads-insights-auth = "threads_insights.auth:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
